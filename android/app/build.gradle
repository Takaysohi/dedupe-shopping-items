plugins {
    id 'com.android.application'
}

android {
    namespace 'com.takaysohi.dedupeshopping'
    compileSdk 34

    defaultConfig {
        applicationId 'com.takaysohi.dedupeshopping'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 鍵は公開リポジトリに置かない。GitHub の Secrets から環境変数で受け取る。
    def keystorePath = System.getenv('KEYSTORE_PATH')

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'dedupe'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 鍵が無いときは仮の署名(debug)でビルドする
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
